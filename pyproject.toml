[project]
name = "ask-soony"
version = "0.1.0"
description = "Watches the Soony portal, keeps every file version and lets an LLM agent analyse each change"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.0",
    "fastapi>=0.165.0",
    "httpx>=0.28",
    "openai>=1.60",
    "openpyxl>=3.1",
    "pillow>=11.0",
    "pypdf>=5.0",
    "pypdfium2>=4.30",
    "pywebpush>=2.5.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ask-soony = "ask_soony.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ask_soony"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# Long SQL statements read better on one line.
"src/ask_soony/store.py" = ["E501"]
